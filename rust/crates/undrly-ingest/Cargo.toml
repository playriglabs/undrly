[package]
name = "undrly-ingest"
description = "Ingestion for Undrly: raw source record → normalize → resolve identities → persist, atomically."
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
chrono.workspace = true
sqlx.workspace = true
thiserror.workspace = true
undrly-core.workspace = true
undrly-normalize.workspace = true
undrly-provider = { workspace = true, features = ["http"] }
undrly-store.workspace = true
# SHA-256 of a reviewed document, checked before its facts are used (V1.6).
sha2 = "0.10"

[dev-dependencies]
serde_json.workspace = true
tokio = { workspace = true, features = ["net", "io-util"] }
undrly-store = { workspace = true, features = ["testing"] }

[lints]
workspace = true
