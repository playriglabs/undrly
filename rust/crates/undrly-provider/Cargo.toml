[package]
name = "undrly-provider"
description = "Provider boundary for Undrly: capability traits that turn provider payloads into provider-native records."
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
reqwest = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
undrly-core.workspace = true

[features]
# Network transport for real sources. The only network code in the workspace;
# decoding never needs it.
http = ["dep:reqwest"]

[dev-dependencies]
rust_decimal.workspace = true

[lints]
workspace = true
