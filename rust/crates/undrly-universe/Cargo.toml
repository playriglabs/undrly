[package]
name = "undrly-universe"
description = "V1.1 universe builder: raw universe files + id map to a curated-format snapshot and an import report. Pure and deterministic; no I/O besides what the caller passes in."
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
thiserror.workspace = true
undrly-core.workspace = true
undrly-provider.workspace = true

[lints]
workspace = true

[dev-dependencies]
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
