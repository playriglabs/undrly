[package]
name = "undrly-collect"
description = "Sequential collector for the cross-market demo: seed reference data, poll quote sources raw-first, refresh canonical quotes."
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
tokio = { workspace = true, features = ["time"] }
undrly-core.workspace = true
undrly-ingest = { path = "../undrly-ingest" }
undrly-normalize.workspace = true
undrly-provider = { workspace = true, features = ["http"] }
undrly-store.workspace = true
undrly-universe = { version = "0.1.0", path = "../undrly-universe" }

[lints]
workspace = true
