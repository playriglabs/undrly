[package]
name = "undrly-store"
description = "PostgreSQL persistence for Undrly: migrations and the mapping between canonical domain types and SQL."
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
chrono.workspace = true
sqlx.workspace = true
thiserror.workspace = true
undrly-core.workspace = true

[features]
# Database test harness for this crate's and dependent crates' tests.
testing = []

[dev-dependencies]
undrly-store = { path = ".", features = ["testing"] }
rust_decimal.workspace = true
serde_json.workspace = true
tokio.workspace = true
uuid = { workspace = true, features = ["v4"] }

[lints]
workspace = true
