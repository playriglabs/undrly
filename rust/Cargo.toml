[workspace]
resolver = "3"
members = [
    "crates/undrly-core",
    "crates/undrly-store",
    "crates/undrly-provider",
    "crates/undrly-normalize",
    "crates/undrly-ingest",
    "crates/undrly-collect",
]

[workspace.package]
edition = "2024"
rust-version = "1.88"
publish = false

[workspace.dependencies]
undrly-core = { path = "crates/undrly-core" }
undrly-store = { path = "crates/undrly-store" }
undrly-provider = { path = "crates/undrly-provider" }
undrly-normalize = { path = "crates/undrly-normalize" }

chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
# Network access is confined to undrly-provider's `http` feature.
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
rust_decimal = { version = "1", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9", default-features = false, features = ["postgres", "runtime-tokio", "migrate", "macros", "uuid", "chrono", "rust_decimal"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
uuid = { version = "1", features = ["v7"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
# Financial values must never pass through floating point.
float_arithmetic = "deny"
float_cmp = "deny"
lossy_float_literal = "deny"
